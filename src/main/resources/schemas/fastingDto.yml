type: object
required:
  - fastingType
  - start

properties:
  fastingType:
    type: string
    example: Intermittent Fasting

  duration:
    type: object
    properties:
      hours:
        type: integer
        example: 16
      minutes:
        type: integer
        example: 30
      seconds:
        type: integer
        example: 10

  start:
    type: string
    format: date-time
    example: 2026-04-03T16:15:05Z

  end:
    type: string
    format: date-time
    example: 2026-04-04T08:45:15Z

  notes:
    type: string
    example: Felt good during the fasting window